<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vakit</title>
<meta name="description" content="Namaz, su ve spor rutini takibi; ntfy ile hatırlatma.">
<meta name="theme-color" content="#1F5A46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#F4F7F2; --ink:#15201B; --muted:#5A675F; --line:#D8DFD5;
  --accent:#1F5A46; --accent-ink:#FFFFFF;
  --prayer:#8E6D22; --prayer-soft:#F4EDDC;
  --water:#2870A0; --water-soft:#E0EDF6;
  --sport:#B44E26; --sport-soft:#F7E5DC;
  --warn:#A83D27;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#151D1A; --surface-2:#1B2521; --ink:#E6EDE8; --muted:#93A199; --line:#28332F;
    --accent:#6CC29F; --accent-ink:#0D1311;
    --prayer:#D8B569; --prayer-soft:#29251A;
    --water:#66B4E0; --water-soft:#15283A;
    --sport:#EC8962; --sport-soft:#33211A;
    --warn:#F08A72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151D1A; --surface-2:#1B2521; --ink:#E6EDE8; --muted:#93A199; --line:#28332F;
  --accent:#6CC29F; --accent-ink:#0D1311;
  --prayer:#D8B569; --prayer-soft:#29251A;
  --water:#66B4E0; --water-soft:#15283A;
  --sport:#EC8962; --sport-soft:#33211A;
  --warn:#F08A72;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.45 var(--body); -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px; margin:0 auto; padding-inline:16px; padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 104px); display:flex; flex-direction:column; gap:14px}

/* ust bilgi */
.top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.brand{font-family:var(--display); font-weight:600; font-size:22px; letter-spacing:-.01em}
.dates{text-align:right; color:var(--muted); font-size:13px; line-height:1.3}
.dates b{color:var(--ink); font-weight:600; display:block}

/* sonraki vakit */
.hero{padding:6px 2px 4px; display:flex; flex-direction:column; gap:4px}
.hero .lbl{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.hero .count{font-family:var(--display); font-weight:500; font-size:52px; line-height:1; letter-spacing:-.02em}
.hero .count small{font-family:var(--body); font-size:17px; color:var(--muted); font-weight:500; margin:0 10px 0 3px; letter-spacing:0}
.hero .sub{color:var(--muted)}
.nudge{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--prayer-soft); border-radius:12px; padding:10px 12px; margin-top:8px}
.nudge span{font-weight:500}
.nudge button{border:0; background:var(--prayer); color:var(--surface); font-weight:600; border-radius:999px; padding:7px 14px; white-space:nowrap}

/* Baba */
.baba{display:grid; grid-template-columns:76px 1fr; gap:12px; align-items:start}
.baba .face{width:76px; height:76px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--line)}
.baba .face svg{width:100%; height:100%; display:block}
.baba .bubble{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:4px 16px 16px 16px; padding:10px 14px 12px; display:flex; flex-direction:column; gap:8px}
.baba .bubble p{margin:0; font-size:16px; line-height:1.4}
.baba.happy .bubble{border-color:var(--prayer)}
.baba.sad .face{animation:tsk 1.4s ease-in-out 1}
@keyframes tsk{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}}
.eyes{transform-origin:60px 58px; animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){.eyes,.baba.sad .face{animation:none}}

/* kartlar */
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 14px 16px; display:flex; flex-direction:column; gap:12px}
.card-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.card-h h2{margin:0; font-family:var(--display); font-weight:600; font-size:19px}
.card-h .meta{color:var(--muted); font-size:13px}
.info{color:var(--muted); font-size:13px}

/* namaz satirlari */
.plist{display:flex; flex-direction:column; gap:6px}
.prow{display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:12px; width:100%; text-align:left; border:1px solid transparent; background:var(--surface-2); border-radius:12px; padding:10px 10px 10px 14px}
.prow .pn{font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px}
.prow .pt{color:var(--muted); font-size:15px}
.prow.now{border-color:var(--prayer); background:var(--prayer-soft)}
.pill{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--prayer); border:1px solid currentColor; border-radius:999px; padding:1px 7px}
.tick{width:34px; height:34px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; color:transparent; transition:background .15s, border-color .15s}
.prow.done .tick{background:var(--prayer); border-color:var(--prayer); color:var(--surface)}
.prow.done .pn{color:var(--ink)}
.prow:disabled{cursor:default}
.prow:disabled .pn,.prow:disabled .pt{opacity:.55}
.prow:disabled .tick{border-style:dashed}
.prow.missed .tick{border-color:var(--warn)}

/* su */
.big{font-family:var(--display); font-size:30px; font-weight:500; line-height:1}
.big small{font-family:var(--body); font-size:14px; color:var(--muted); font-weight:500}
.bar{height:8px; border-radius:99px; background:var(--water-soft); overflow:hidden}
.bar i{display:block; height:100%; background:var(--water); border-radius:99px; transition:width .25s}
.glasses{display:flex; flex-wrap:wrap; gap:6px}
.glass{width:34px; height:40px; border:0; background:none; padding:0; color:var(--water)}
.glass svg{width:100%; height:100%}
.row{display:flex; flex-wrap:wrap; gap:8px}
.btn{border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:9px 16px; font-weight:600}
.btn.water{background:var(--water); border-color:var(--water); color:var(--surface)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5; cursor:default}

/* spor */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:7px 13px; font-weight:500}
.chip[aria-pressed="true"]{background:var(--sport); border-color:var(--sport); color:var(--surface)}
.chips.day .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.sstat{display:flex; align-items:baseline; gap:8px}
.sstat .big{color:var(--sport)}
.sub-h{font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600}

/* gecmis */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat{background:var(--surface-2); border-radius:12px; padding:10px 12px}
.stat b{display:block; font-family:var(--display); font-size:22px; font-weight:500}
.stat span{font-size:12px; color:var(--muted)}
.hist{display:flex; flex-direction:column}
.hrow{display:grid; grid-template-columns:62px auto 1fr 46px; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hd{font-size:13px; line-height:1.2}
.hd b{display:block; font-weight:600; font-size:14px}
.dots{display:flex; gap:4px}
.dots i{width:10px; height:10px; border-radius:50%; border:1.5px solid var(--prayer)}
.dots i.on{background:var(--prayer)}
.mini{height:6px; border-radius:9px; background:var(--water-soft); overflow:hidden}
.mini i{display:block; height:100%; background:var(--water)}
.hs{text-align:right; font-size:13px; color:var(--sport); font-weight:600}
.hs.none{color:var(--muted); font-weight:400}

/* ayarlar */
.field{display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px}
.field label{font-weight:500}
.field input,.field select{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0; width:120px}
.field input[type="checkbox"]{width:22px; height:22px; accent-color:var(--accent)}
.topic{display:flex; gap:8px; align-items:center; background:var(--surface-2); border:1px dashed var(--line); border-radius:12px; padding:10px 12px}
.topic code{flex:1; font:600 15px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; overflow-wrap:anywhere; user-select:all}
ol.steps{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px}
ol.steps a{color:var(--accent); font-weight:600}
.status{display:flex; align-items:center; gap:8px; font-weight:600}
.status i{width:9px; height:9px; border-radius:50%; background:var(--muted)}
.status.on i{background:var(--accent)}
.status.err i{background:var(--warn)}
.note{font-size:13px; color:var(--muted); margin:0}

/* alt menu */
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 6px); display:flex; justify-content:center}
nav.tabs div{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:100%; max-width:520px}
nav.tabs button{border:0; background:none; border-radius:12px; padding:9px 4px; font-weight:600; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px}
nav.tabs button svg{width:22px; height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent); background:var(--surface-2)}

.toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100% - 32px)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.err{color:var(--warn); font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav class="tabs" aria-label="Bölümler"><div>
  <button data-tab="bugun" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 4a8 8 0 1 0 4 12A7 7 0 0 1 16 4Z"/></svg>Bugün</button>
  <button data-tab="gecmis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Geçmiş</button>
  <button data-tab="ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ayarlar</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
'use strict';
/* ---------- durum ---------- */
const LS = 'vakit.v1';
const DEF = {
  settings: {
    city: 'Antalya', topic: '', ntfyOn: false,
    waterGoal: 2500, glass: 250, waterFrom: '09:00', waterTo: '21:00', waterEvery: 120,
    sportTime: '18:30', sportDays: [0,1,2,3,4,5,6], sportGoal: 30,
    lateMin: 30, summaryTime: '22:30',
    yatsiAsk: '23:30', waterAsk1: '14:00', waterAsk2: '20:00', sportAsk1: '13:00', sportAsk2: '21:00',
    n: { start: true, late: false, water: false, sport: true, summary: false, ask: true, askWater: true, askSport: true },
    v: 2
  },
  days: {}, times: {}, sent: {}, lastSync: 0, lastSyncCount: 0, syncErr: ''
};
const clone = o => JSON.parse(JSON.stringify(o));
function merge(r) {
  const s = clone(DEF);
  Object.assign(s, r);
  s.settings = Object.assign(clone(DEF.settings), r.settings || {});
  s.settings.n = Object.assign({}, DEF.settings.n, (r.settings || {}).n || {});
  s.settings.v = (r.settings && r.settings.v) || (r.settings ? 1 : DEF.settings.v);
  return s;
}
// Android uygulamasinin icinde miyiz? (MainActivity window.VakitApp koprusunu ekler)
const APP = typeof window.VakitApp !== 'undefined';
function load() {
  try { const r = JSON.parse(APP ? window.VakitApp.load() : localStorage.getItem(LS)); if (r) return merge(r); } catch (e) {}
  return clone(DEF);
}
function save() {
  const j = JSON.stringify(S);
  try { if (APP) window.VakitApp.save(j); else localStorage.setItem(LS, j); } catch (e) {}
}
function randomTopic() { const a = new Uint8Array(10); crypto.getRandomValues(a); return 'vakit-' + Array.from(a, b => (b % 36).toString(36)).join(''); }
let S = load();
if (!S.settings.topic) { S.settings.topic = randomTopic(); save(); }
// v2: Baba'nin sorulari, 2 saatte bir su ve "cikmadan once" hatirlatmalarinin yerini aldi
if ((S.settings.v || 1) < 2) { Object.assign(S.settings.n, { water: false, late: false, summary: false }); S.settings.v = 2; save(); }
let TAB = 'bugun';

/* ---------- tarih ---------- */
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const at = (dk, hm) => { const [h, mi] = hm.split(':').map(Number); const d = fromKey(dk); d.setHours(h, mi, 0, 0); return d.getTime(); };
const hmOf = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const toMin = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const todayKey = () => dkey(new Date());
const liters = ml => (ml / 1000).toLocaleString('tr-TR', { maximumFractionDigits: 2 });

const P = [
  { k: 'sabah', n: 'Sabah', end: 'gunes' },
  { k: 'ogle', n: 'Öğle', end: 'ikindi' },
  { k: 'ikindi', n: 'İkindi', end: 'aksam' },
  { k: 'aksam', n: 'Akşam', end: 'yatsi' },
  { k: 'yatsi', n: 'Yatsı', end: null }
];
const NAME = { sabah: 'Sabah', gunes: 'Güneş', ogle: 'Öğle', ikindi: 'İkindi', aksam: 'Akşam', yatsi: 'Yatsı' };
const DAT = { sabah: 'Sabah vaktine', gunes: 'Güneşin doğuşuna', ogle: 'Öğleye', ikindi: 'İkindiye', aksam: 'Akşama', yatsi: 'Yatsıya' };
const HIJRI = ['Muharrem','Safer','Rebiülevvel','Rebiülahir','Cemaziyelevvel','Cemaziyelahir','Recep','Şaban','Ramazan','Şevval','Zilkade','Zilhicce'];
const DAYS = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const SPORTS = ['Yürüyüş','Koşu','Ağırlık','Bisiklet','Esneme','Diğer'];

const peek = dk => S.days[dk];
function day(dk) {
  if (!S.days[dk]) S.days[dk] = { p: {}, water: 0, sport: { min: 0, type: '' } };
  return S.days[dk];
}

/* ---------- Baba ---------- */
/* Diyaloglar. Her soru yuvasi kendi havuzunda gunden gune siraya girer (rot),
   havuz boyu = 20 gun x gunluk soru sayisi; boylece en az 20 gun ayni cumle tekrar etmez.
   Tepkiler iki parcadan kurulur (combo): acilis x kapanis = 100 / 48 farkli cumle. */
const L = {
  ask: {
    sabah: [
      'Güneş doğdu. Sabah namazını kıldın mı, yoksa alarmla kavgan mı sürüyor?',
      'Sabah vakti çıktı. Kalktın mı, yoksa yorgan yine mi galip geldi?',
      'Güneş doğdu evladım. Sabahı kıldın mı, dürüst ol.',
      'Sabah namazı… Hani şu "yarın kesin kalkarım" dediğin. Kıldın mı?',
      'Güneş çoktan doğdu. Sen de doğdun mu, namazı kıldın mı?',
      'Sabahın bereketi erken kalkana. Kıldın mı bakalım?',
      'Sabah vakti bitti. Seccade mi serildi, yastık mı kabardı?',
      'Horoz bile kalktı. Sen sabahı kıldın mı?',
      'Alarmı kaç kere erteledin, onu sormayacağım. Sabahı kıldın mı?',
      'Güneş doğdu, kuşlar ötüyor. Senin namaz ne durumda?',
      'Sabah namazı kaçtı mı, yakalandı mı? Merak içindeyim.',
      'Ben senin yaşında ezandan önce kalkardım. Sen sabahı kıldın mı?',
      'Sabah vakti çıktı evladım. Güne namazla mı başladın?',
      'Günaydın demeden önce sorayım: sabahı kıldın mı?',
      'Sabahı kılan güne bir sıfır önde başlar. Sen kaç kaçsın?',
      'Gözünü açınca ilk iş ne oldu? Telefon mu, namaz mı?',
      'Güneş doğdu, vakit çıktı. Kıldıysan bir çay koyayım.',
      'Sabah namazı en zoru, biliyorum. O yüzden soruyorum: kıldın mı?',
      'Uykunun tatlısı sabah namazından sonra uyunur. Kıldın mı?',
      'Sabah vakti çıktı. "Uyuyordum" diyeceksen hiç söyleme, yüzünden anlarım.'
    ],
    ogle: [
      'Öğle vakti çıktı. İşin gücün arasında kıldın mı?',
      'Öğle bitti. Öğle yemeğini unutmadın, namazı unuttun mu?',
      'Öğle vakti gitti. Toplantı mı uzadı, yoksa kıldın mı?',
      'Öğleyi kıldın mı? "Çok yoğundum" deme, herkes yoğun.',
      'Öğle vakti çıktı evladım. Dört rekat on dakika, biliyorsun.',
      'Gün ortası geçti. Öğleyi kıldıysan bir aferin hak ettin.',
      'Öğle namazı… Kıldın mı, yoksa "akşam toplu kılarım" mı diyeceksin?',
      'Karnını doyurdun, ruhunu doyurdun mu? Öğleyi kıldın mı?',
      'Öğle vakti çıktı. Ben sormadan söyleseydin daha çok sevinirdim. Kıldın mı?',
      'Öğle bitti yavrum. Ekrandan başını kaldırıp kıldın mı?',
      'Öğleyi kıldın mı? Mesai bahane değil.',
      'Güneş tepeden kaydı, öğle vakti çıktı. Kıldın mı?',
      'Öğle namazını sordum diye bozulma. Kıldın mı?',
      'Öğle vakti gitti. Namaz mı kılındı, yoksa mesaj mı yazıldı?',
      'Öğle geçti. Kıldıysan bugünün yarısı iyi gitmiş demektir.',
      'Öğleyi kıldın mı? Bir "evet" duysam bütün günüm güzelleşecek.',
      'Öğle vakti çıktı. Bir dizi bölümü kadar bile sürmüyor. Kıldın mı?',
      'Yemekten sonra çay, çaydan önce namaz. Öğleyi kıldın mı?',
      'Öğle vakti bitti. Kıldın mı, yoksa yine mi hayal kırıklığı?',
      'Öğle namazı kaçtı mı? Kaçmadıysa söyle de bir rahatlayayım.'
    ],
    ikindi: [
      'İkindi vakti çıktı. Günün yorgunluğunda kıldın mı?',
      'Akşam ezanı okundu, ikindi bitti. Kılabildin mi?',
      'İkindiyi kıldın mı? En çok kaçırılan vakittir, bilirim.',
      'İkindi vakti gitti evladım. Yetiştin mi?',
      'İkindi bitti. Çay saatinde namaz saatini de hatırladın mı?',
      'Güneş batıyor, ikindi çıktı. Kıldın mı bakalım?',
      'İkindi namazı… O "sonra kılarım" dediğin vakit. Kıldın mı?',
      'İkindiyi kıldıysan günün çoğu kurtuldu. Kıldın mı?',
      'İkindi vakti çıktı. Yolda mıydın, işte miydin, yoksa kıldın mı?',

// gun numarasi (yerel takvim gunu, saat diliminden bagimsiz)
const serial = dk => { const [y, m, d] = dk.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const mod = (a, n) => ((a % n) + n) % n;
// ayni yuva her gun havuzda bir sonraki cumleye gecer
function rot(arr, dk, slot = 0, slots = 1) { return arr[mod(serial(dk) * slots + slot, arr.length)]; }
// iki parcali cumle: ardisik A.length*B.length gunde hic tekrar etmez
function combo(pair, dk, slot = 0, slots = 1) {
  const [A, B] = pair, k = serial(dk) * slots + slot;
  return A[mod(k, A.length)] + ' ' + B[mod(Math.floor(k / A.length), B.length)];
}
const PIDX = { sabah: 0, ogle: 1, ikindi: 2, aksam: 3, yatsi: 4 };
function react(type, yes, dk, id) {
  const slot = type === 'p' ? PIDX[id.slice(2)] || 0 : id.endsWith('2') ? 1 : 0;
  return combo(L.react[type][yes ? 'yes' : 'no'], dk, slot, type === 'p' ? 5 : 2);
}
const startLine = (dk, k, n) => combo(L.pStart, dk, PIDX[k], 5).replace(/\{n\}/g, n);
// ayni gun ayni soruya hep ayni cumle, gunden gune degissin
function pick(arr, seed) { let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) | 0; return arr[Math.abs(h) % arr.length]; }
const fill = (s, n) => s.replace('{n}', n);

/* bir gunun sorulari: namaz vakti cikinca, su ve spor gunde ikiser kez */
function asksFor(dk) {
  const s = S.settings, t = timesFor(dk), out = [];
  if (s.n.ask && t) for (const p of P) {
    const ts = p.end ? at(dk, t[p.end]) : at(dk, s.yatsiAsk);
    out.push({ id: 'p:' + p.k, type: 'p', k: p.k, ts, dk,
      q: rot(L.ask[p.k], dk) });
  }
  if (s.n.askWater) [s.waterAsk1, s.waterAsk2].forEach((hm, i) => out.push({ id: 'w' + (i + 1), type: 'w', ts: at(dk, hm), dk, q: rot(L.wAsk, dk, i, 2) }));
  if (s.n.askSport) [s.sportAsk1, s.sportAsk2].forEach((hm, i) => out.push({ id: 's' + (i + 1), type: 's', ts: at(dk, hm), dk, q: rot(L.sAsk, dk, i, 2) }));
  return out.sort((a, b) => a.ts - b.ts);
}
function answered(a) {
  const d = peek(a.dk);
  if (!d) return false;
  if (d.ask && a.id in d.ask) return true;
  return a.type === 'p' && !!d.p[a.k];   // zaten isaretlediysen sormaz
}
function pendingAsks() {
  const now = Date.now(), y = dkey(addDays(new Date(), -1));
  // dunun sorulari: yalnizca gece yarisindan sonraki yatsi
  const list = asksFor(y).filter(a => a.id === 'p:yatsi' && new Date().getHours() < 12).concat(asksFor(todayKey()));
  return list.filter(a => a.ts <= now && !answered(a));
}
let babaSays = null;   // { text, mood } — cevaptan sonraki tepki
const ASK_OPTS = {
  p: [['Kıldım', 1], ['Kılamadım', 0]],
  w: [['1 bardak', 1], ['2', 2], ['3', 3], ['4+', 4], ['İçmedim', 0]],
  s: [['15 dk', 15], ['30 dk', 30], ['45+ dk', 45], ['Yapmadım', 0]]
};
// val: namazda 1/0, suda bardak sayisi, sporda dakika (ntfy'den gelen 1 = hedef kadar)
function answer(dk, id, val) {
  val = Number(val) || 0;
  const d = day(dk), type = id[0], yes = val > 0;
  d.ask = d.ask || {};
  d.ask[id] = yes;
  if (type === 'p') d.p[id.slice(2)] = yes;
  if (type === 'w') d.water += val * S.settings.glass;
  if (type === 's') { d.sport = d.sport || { min: 0, type: '' }; d.sport.min = Math.max(d.sport.min || 0, val === 1 ? S.settings.sportGoal : val); }
  babaSays = { text: react(type, yes, dk, id), mood: yes ? 'happy' : 'sad' };
  save();
}
function babaCard() {
  const tk = todayKey(), q = pendingAsks()[0], st = S.settings;
  let text, mood = '', btns = '';
  if (babaSays) { text = babaSays.text; mood = babaSays.mood; }
  else if (q) {
    text = q.q;
    btns = `<div class="row">${ASK_OPTS[q.type].map(([label, v]) => `<button class="btn ${v ? 'primary' : ''}" data-act="ans" data-d="${q.dk}" data-id="${q.id}" data-v="${v}">${label}</button>`).join('')}</div>`;
  } else {
    const d = peek(tk) || { p: {}, water: 0, sport: { min: 0 } }, now = Date.now(), h = new Date().getHours(), t = timesFor(tk);
    const missed = t ? P.filter(p => p.end && at(tk, t[p.end]) <= now && !d.p[p.k]).length : 0;
    const done = P.every(p => d.p[p.k]) && d.water >= st.waterGoal && d.sport && d.sport.min;
    if (done) { text = rot(L.allDone, tk); mood = 'happy'; }
    else if (missed) { text = rot(L.lagPray, tk).replace('{x}', missed); mood = 'sad'; }
    else if (h >= 18 && d.water < st.waterGoal / 2) { text = rot(L.lagWater, tk).replace('{x}', liters(d.water)); mood = 'sad'; }
    else if (now >= at(tk, st.sportAsk2) && !(d.sport && d.sport.min)) { text = rot(L.lagSport, tk); mood = 'sad'; }
    else text = combo(L.hello[h < 5 ? 'gece' : h < 11 ? 'sabah' : h < 17 ? 'ogle' : 'aksam'], tk);
  }
  return `<section class="baba ${mood}"><div class="face">${babaSVG(mood)}</div>
    <div class="bubble"><p>${esc(text)}</p>${btns}</div></section>`;
}

/* ---------- namaz vakitleri ----------
   Ana kaynak: Diyanet'in resmi takvimi (ezanvakti.emushaf.net, ~30 gun ileri).
   Yedek: Aladhan, Diyanet yontemi (method 13) — birkac dakika sapabilir. */
let timesErr = '';
const EZAN = 'https://ezanvakti.emushaf.net';
const fold = s => s.trim().replace(/İ/g, 'I').replace(/ı/g, 'i').toLocaleUpperCase('en').normalize('NFD').replace(/[̀-ͯ]/g, '');
const placeKey = () => fold(S.settings.city);
function timesFor(dk) {
  const c = S.times;
  return c && c.place === placeKey() && c.days && c.days[dk] ? cleanDay(c.days[dk]) || undefined : undefined;
}
// dis servisten gelen veri sayfaya yaziliyor: yalnizca SS:DD saatleri ve sayisal hicri tarih kabul et
const HM = /^([01]\d|2[0-3]):[0-5]\d$/;
function cleanDay(v) {
  if (!v || !['sabah', 'gunes', 'ogle', 'ikindi', 'aksam', 'yatsi'].every(k => HM.test(v[k]))) return null;
  const m = /^(\d{1,2}) (\S+) (\d{4})$/.exec(v.hicri || '');
  return { sabah: v.sabah, gunes: v.gunes, ogle: v.ogle, ikindi: v.ikindi, aksam: v.aksam, yatsi: v.yatsi,
    hicri: m && HIJRI.includes(m[2]) ? `${Number(m[1])} ${m[2]} ${Number(m[3])}` : '' };
}
function storeDays(raw, src) {
  const days = {};
  for (const [k, v] of Object.entries(raw)) { const c = /^\d{4}-\d{2}-\d{2}$/.test(k) && cleanDay(v); if (c) days[k] = c; }
  if (!Object.keys(days).length) throw new Error('Vakit verisi okunamadı');
  if (S.times.place !== placeKey()) S.times = { place: placeKey(), days: {} };
  Object.assign(S.times.days, days);
  S.times.src = src;
  const min = dkey(addDays(new Date(), -3));
  for (const k of Object.keys(S.times.days)) if (k < min) delete S.times.days[k];
  save();
}
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('Vakit servisi ' + r.status + ' döndü');
  return r.json();
}
async function resolveIlce() {
  const s = S.settings;
  if (s.ilceId && s.ilceFor === placeKey()) return s.ilceId;
  const sehirler = await getJSON(`${EZAN}/sehirler/2`);
  const sehir = sehirler.find(x => fold(x.SehirAdi) === placeKey());
  if (!sehir) throw new Error(`"${s.city}" il olarak bulunamadı`);
  const ilceler = await getJSON(`${EZAN}/ilceler/${sehir.SehirID}`);
  const ilce = ilceler.find(x => fold(x.IlceAdi) === placeKey()) || ilceler[0];
  s.ilceId = ilce.IlceID; s.ilceFor = placeKey(); save();
  return s.ilceId;
}
async function fetchDiyanet() {
  const id = await resolveIlce();
  const list = await getJSON(`${EZAN}/vakitler/${id}`);
  const days = {};
  for (const v of list) {
    const [dd, mm, yy] = v.MiladiTarihKisa.split('.');
    const [hd, hm, hy] = v.HicriTarihKisa.split('.').map(Number);
    days[`${yy}-${mm}-${dd}`] = { sabah: v.Imsak, gunes: v.Gunes, ogle: v.Ogle, ikindi: v.Ikindi, aksam: v.Aksam, yatsi: v.Yatsi, hicri: `${hd} ${HIJRI[hm - 1]} ${hy}` };
  }
  if (!Object.keys(days).length) throw new Error('Vakit listesi boş geldi');
  storeDays(days, 'Diyanet takvimi');
}
async function fetchAladhan() {
  const now = new Date(), cut = s => s.slice(0, 5), days = {};
  for (const d of [now, addDays(now, 5)]) {
    const j = await getJSON(`https://api.aladhan.com/v1/calendarByCity/${d.getFullYear()}/${d.getMonth() + 1}?city=${encodeURIComponent(S.settings.city.trim())}&country=Turkey&method=13`);
    if (j.code !== 200 || !Array.isArray(j.data)) throw new Error('Şehir bulunamadı');
    for (const x of j.data) {
      const [dd, mm, yy] = x.date.gregorian.date.split('-'), t = x.timings, h = x.date.hijri;
      days[`${yy}-${mm}-${dd}`] = { sabah: cut(t.Fajr), gunes: cut(t.Sunrise), ogle: cut(t.Dhuhr), ikindi: cut(t.Asr), aksam: cut(t.Maghrib), yatsi: cut(t.Isha), hicri: `${Number(h.day)} ${HIJRI[h.month.number - 1]} ${h.year}` };
    }
  }
  storeDays(days, 'Diyanet yöntemiyle hesap (yedek kaynak)');
}
let lastFetch = 0;
async function ensureTimes(force) {
  const now = new Date();
  const have = [0, 1, 2].every(i => timesFor(dkey(addDays(now, i))));
  // takvim yeterliyse gunde bir kez tazele
  if (have && !force && S.times.src === 'Diyanet takvimi' && Date.now() - lastFetch < 12 * 3600e3) { timesErr = ''; return; }
  if (!navigator.onLine) { timesErr = have ? '' : 'İnternet yok'; return; }
  try { await fetchDiyanet(); lastFetch = Date.now(); timesErr = ''; }
  catch (e) {
    try { await fetchAladhan(); lastFetch = Date.now(); timesErr = ''; }
    catch (e2) { timesErr = have ? '' : (e.message || 'Vakitler alınamadı'); }
  }
}

/* o an hangi vakitteyiz, sonraki ne */
function vakitState(now = Date.now()) {
  const tk = dkey(new Date(now)), t = timesFor(tk);
  if (!t) return null;
  const seq = ['sabah', 'gunes', 'ogle', 'ikindi', 'aksam', 'yatsi'].map(k => ({ k, ts: at(tk, t[k]) }));
  let next = seq.find(x => x.ts > now);
  if (!next) {
    const tmk = dkey(addDays(new Date(now), 1)), tm = timesFor(tmk);
    if (tm) next = { k: 'sabah', ts: at(tmk, tm.sabah) };
  }
  let cur = null, curDay = tk;
  for (const x of seq) if (x.ts <= now) cur = x.k;
  if (cur === 'gunes') cur = null;               // kuslukta farz vakit yok
  if (!cur) {
    if (now < seq[0].ts) { cur = 'yatsi'; curDay = dkey(addDays(new Date(now), -1)); } // gece yarisindan sonra dunun yatsisi
  }
  return { t, cur, curDay, next };
}

/* ---------- ntfy hatirlatmalari ---------- */
/* ntfy'ye kurulacak bildirimler. Her birinin sabit bir kimligi (sequence_id) var:
   boylece sonradan silinebiliyor. ntfy en fazla 3 gun ileriye kurmaya izin veriyor. */
const HORIZON = 71 * 3600e3;
function buildEvents() {
  const s = S.settings, now = Date.now(), horizon = now + HORIZON, out = [];
  const app = location.origin + location.pathname;
  const LBL = { p: ['Kıldım', 'Kılamadım'], w: ['İçtim', 'İçmedim'], s: ['Yaptım', 'Yapmadım'] };
  const TAG = { p: 'mosque', w: 'droplet', s: 'muscle' };
  for (let i = 0; i < 4; i++) {
    const d = addDays(new Date(), i), dk = dkey(d), t = timesFor(dk);
    if (t) {
      for (const p of P) {
        const start = at(dk, t[p.k]);
        const endTs = p.end ? at(dk, t[p.end]) : at(dk, '23:30');
        const endName = p.end ? NAME[p.end] : null;
        if (s.n.start) out.push({
          id: `start-${dk}-${p.k}`, ts: start, tags: ['mosque'], priority: 4,
          title: `${p.n} vakti · ${t[p.k]}`,
          message: startLine(dk, p.k, p.n) + (endName ? ` (${endName} ${t[p.end]})` : '')
        });
        const late = endTs - s.lateMin * 60e3;
        // namazi zaten isaretlediysen "cikiyor" uyarisi da gelmesin
        if (s.n.late && late > start + 10 * 60e3 && !(peek(dk) && peek(dk).p[p.k])) out.push({
          id: `late-${dk}-${p.k}`, ts: late, tags: ['hourglass_flowing_sand'], priority: 4,
          title: `${p.n} vaktinin çıkmasına ${s.lateMin} dk`,
          message: endName ? `Kılmadıysan şimdi kıl. ${endName} ${t[p.end]} saatinde.` : 'Kılmadıysan yatmadan önce kıl.'
        });
      }
    }
    if (s.n.water) {
      const every = Math.max(30, Number(s.waterEvery) || 120);
      for (let m = toMin(s.waterFrom); m <= toMin(s.waterTo); m += every) {
        const hm = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
        out.push({ id: `water-${dk}-${hm.replace(':', '')}`, ts: at(dk, hm), tags: ['droplet'], priority: 3,
          title: 'Su içme vakti', message: `Bir bardak (${s.glass} ml) iç. Günlük hedef ${liters(s.waterGoal)} L.` });
      }
    }
    if (s.n.sport && s.sportDays.includes(d.getDay())) {
      out.push({ id: `sport-${dk}`, ts: at(dk, s.sportTime), tags: ['muscle'], priority: 4,
        title: 'Spor zamanı', message: `Bugünkü hedef: ${s.sportGoal} dakika. Bitince uygulamada işaretle.` });
    }
    for (const a of asksFor(dk)) {
      if (answered(a)) continue;           // onceden isaretlediysen sormaz
      const u = v => `${app}?c=${a.dk}~${a.id}~${v}`;
      out.push({ id: `ask-${dk}-${a.id.replace(':', '-')}`, ts: a.ts, tags: [TAG[a.type]], priority: 4,
        title: a.type === 'p' ? (a.k === 'yatsi' ? 'Yatsı' : `${NAME[a.k]} vakti çıktı`) : a.type === 'w' ? 'Su' : 'Spor', message: a.q, click: app,
        actions: [{ action: 'view', label: LBL[a.type][0], url: u(1), clear: true }, { action: 'view', label: LBL[a.type][1], url: u(0), clear: true }] });
    }
    if (s.n.summary) {
      out.push({ id: `sum-${dk}`, ts: at(dk, s.summaryTime), tags: ['crescent_moon'], priority: 3,
        title: 'Günü kapat', message: 'Namaz, su ve sporu işaretledin mi? Uygulamayı açıp bak.' });
    }
  }
  const list = out.filter(e => e.ts > now + 60e3 && e.ts < horizon).sort((a, b) => a.ts - b.ts);
  // son kurulan bildirimden hemen sonra: "bitiyorum, bana dokun"
  if (list.length) {
    // penceredeki son uygun aksam 20:00 (gece yarisi uyandirmasin)
    const c = new Date(now + HORIZON - 60e3);
    if (c.getHours() < 20) c.setDate(c.getDate() - 1);
    c.setHours(20, 0, 0, 0);
    if (c.getTime() > now + 60e3) list.push({ id: 'yenile', ts: c.getTime(), tags: ['warning'], priority: 5, click: app,
      title: 'Bildirimler bitiyor',
      message: '3 gündür yüzüme bakmadın. Bir dokun, yoksa bundan sonra susarım. Sonra "kimse hatırlatmadı" deme.' });
  }
  return list;
}

async function ntfyPost(body) {

}
async function ntfyDelete(id) {

  const r = await fetch(`https://ntfy.sh/${encodeURIComponent(S.settings.topic)}/${encodeURIComponent(id)}`, { method: 'DELETE' });

function evHash(e) { let h = 0; for (const c of JSON.stringify([e.ts, e.title, e.message, e.priority, e.actions])) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }
// v2 surumunde kimliksiz kurulanlar silinemez; ayni yuvayi tekrar kurmamak icin eslestir
function legacySeq(id, ts) {
  const [kind, a] = id.split('|'), dk = dkey(new Date(ts)), hm = hmOf(ts).replace(':', '');

let syncing = false, syncAgain = false;
async function syncNtfy() {
  if (APP) { syncNativeSoon(); return; }
  // kapatildiysa ve silinmemis kalan varsa (ntfy siniri vb.) silmeye devam et
  if (!S.settings.ntfyOn) { if (Object.values(S.sent).some(v => typeof v === 'object' && !v.legacy && v.ts > Date.now())) clearNtfy(); return; }
  if (syncing) { syncAgain = true; return; }
  if (!navigator.onLine) return;

  const now = Date.now();
  for (const [id, v] of Object.entries(S.sent)) {
    if (typeof v === 'number') { delete S.sent[id]; if (v > now && id.includes('|')) { const k = legacySeq(id, v); if (k) S.sent[k] = { ts: v, legacy: true }; } }
    else if (v.ts < now) delete S.sent[id];

    for (const [id, v] of Object.entries(S.sent)) {
      if (wantIds.has(id) || v.legacy) continue;
      if (await ntfyDelete(id)) { delete S.sent[id]; save(); }
    }
    for (const e of want) {
      const h = evHash(e), have = S.sent[e.id];
      if (have && (have.h === h || have.legacy)) continue;
      if (have && !(await ntfyDelete(e.id))) continue;   // degisti: once eskisini sil
      const r = await ntfyPost({ title: e.title, message: e.message, tags: e.tags, priority: e.priority, delay: String(Math.floor(e.ts / 1000)),
        sequence_id: e.id, icon: new URL('baba.png', location.href).href, click: e.click || location.origin + location.pathname, actions: e.actions });
      if (r.status === 429) { err = 'ntfy sınırına takıldı, kalanlar sonra kurulacak'; break; }
      if (!r.ok) { err = 'ntfy ' + r.status + ' döndü'; continue; }
      S.sent[e.id] = { ts: e.ts, h }; ok++; save();
      await new Promise(r => setTimeout(r, 150));
    }
  } catch (x) { err = 'ntfy\'ye ulaşılamadı'; }
  S.lastSync = Date.now(); S.syncErr = err;
  if (ok) S.lastSyncCount = ok;
  save(); syncing = false;
  if (TAB === 'ayarlar') render();
  if (syncAgain) { syncAgain = false; syncNtfy(); }
}

const NATIVE_DAYS = 32;
function nativeAsk(a) {

    q: a.q, yes: react(a.type, true, a.dk, a.id), no: react(a.type, false, a.dk, a.id),

function buildNativeEvents() {
  const s = S.settings, now = Date.now(), out = [];

    const d = addDays(new Date(), i), dk = dkey(d), t = timesFor(dk);
    if (t) {

        if (s.n.start) out.push({ kind: 'note', id: `start-${p.k}`, dk, ts: start, title: `${p.n} vakti · ${t[p.k]}`,
          text: startLine(dk, p.k, p.n) + (endName ? ` (${endName} ${t[p.end]})` : '') });
        const late = (p.end ? at(dk, t[p.end]) : at(dk, '23:30')) - s.lateMin * 60e3;
        if (s.n.late && late > start + 10 * 60e3 && !(peek(dk) && peek(dk).p[p.k])) out.push({ kind: 'note', id: `late-${p.k}`, dk, ts: late,
          title: `${p.n} vaktinin çıkmasına ${s.lateMin} dk`, text: endName ? `Kılmadıysan şimdi kıl. ${endName} ${t[p.end]} saatinde.` : 'Kılmadıysan yatmadan önce kıl.' });
      }

    if (s.n.water) {
      const every = Math.max(30, Number(s.waterEvery) || 120);
      for (let m = toMin(s.waterFrom); m <= toMin(s.waterTo); m += every) {
        const hm = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
        out.push({ kind: 'note', id: `water-${hm}`, dk, ts: at(dk, hm), title: 'Su içme vakti', text: `Bir bardak (${s.glass} ml) iç.` });
      }
    }
    if (s.n.sport && s.sportDays.includes(d.getDay()))

    if (s.n.summary)

    for (const a of asksFor(dk)) if (!answered(a)) out.push(nativeAsk(a));
  }
  // namaz vakitleri bitmeden bir gun once: "uygulamayi ac da yenileyeyim"
  if (lastTimes) {
    const ts = at(dkey(addDays(fromKey(lastTimes), -1)), '20:00');

    <div class="field"><label for="sportAsk1">Spor sorusu 1</label><input id="sportAsk1" type="time" data-set="sportAsk1" value="${s.sportAsk1}"></div>
    <div class="field"><label for="sportAsk2">Spor sorusu 2</label><input id="sportAsk2" type="time" data-set="sportAsk2" value="${s.sportAsk2}"></div>
    <p class="note">Diğer namazları vakit çıkınca sorar: sabahı güneş doğunca, öğleyi ikindi girince, vb. Bildirimdeki düğmeye basman cevap için yeterli.</p>
  </section>
  <section class="card">
    <div class="card-h"><h2>Namaz</h2></div>
    <div class="field"><label for="city">Şehir</label><input id="city" data-set="city" value="${esc(s.city)}"></div>
    <div class="field"><label for="lateMin">Vakit çıkmadan kaç dk önce</label><input id="lateMin" type="number" min="10" max="90" step="5" data-set="lateMin" value="${s.lateMin}"></div>
    <p class="note">Yatsı için son hatırlatma 23:30'dan bu süre kadar önce gelir.</p>
  </section>
  <section class="card">
    <div class="card-h"><h2>Su</h2></div>
    <div class="field"><label for="waterGoal">Günlük hedef (ml)</label><input id="waterGoal" type="number" min="500" max="6000" step="250" data-set="waterGoal" value="${s.waterGoal}"></div>
    <div class="field"><label for="glass">Bardak (ml)</label><input id="glass" type="number" min="100" max="1000" step="50" data-set="glass" value="${s.glass}"></div>
    <div class="field"><label for="waterFrom">İlk hatırlatma</label><input id="waterFrom" type="time" data-set="waterFrom" value="${s.waterFrom}"></div>
    <div class="field"><label for="waterTo">Son hatırlatma</label><input id="waterTo" type="time" data-set="waterTo" value="${s.waterTo}"></div>
    <div class="field"><label for="waterEvery">Sıklık</label><select id="waterEvery" data-set="waterEvery">${[60, 90, 120, 150, 180].map(m => `<option value="${m}" ${+s.waterEvery === m ? 'selected' : ''}>${m % 60 ? (m / 60).toLocaleString('tr-TR') : m / 60} saatte bir</option>`).join('')}</select></div>
  </section>
  <section class="card">
    <div class="card-h"><h2>Spor</h2></div>
    <div class="field"><label for="sportTime">Hatırlatma saati</label><input id="sportTime" type="time" data-set="sportTime" value="${s.sportTime}"></div>
    <div class="field"><label for="sportGoal">Hedef (dk)</label><input id="sportGoal" type="number" min="5" max="240" step="5" data-set="sportGoal" value="${s.sportGoal}"></div>
    <div class="sub-h">Spor günleri</div>
    <div class="chips day">${[1, 2, 3, 4, 5, 6, 0].map(i => `<button class="chip" data-act="sday" data-i="${i}" aria-pressed="${s.sportDays.includes(i)}">${DAYS[i]}</button>`).join('')}</div>
  </section>
  <section class="card">
    <div class="card-h"><h2>Gün sonu</h2></div>
    <div class="field"><label for="summaryTime">Kontrol saati</label><input id="summaryTime" type="time" data-set="summaryTime" value="${s.summaryTime}"></div>
  </section>
  <section class="card">
    <div class="card-h"><h2>Yedek</h2></div>
    <p class="note">Kayıtların yalnızca bu telefonda durur. Telefon değiştirirken yedeği indirip yenisinde geri yükle.</p>
    <div class="row"><button class="btn" data-act="export">${APP ? 'Yedeği paylaş' : 'Yedeği indir'}</button><button class="btn" data-act="import" ${APP ? 'hidden' : ''}>Yedekten yükle</button></div>
  </section>`;
}

function render() {
  const app = $('#app');
  app.innerHTML = TAB === 'bugun' ? viewToday() : TAB === 'gecmis' ? viewHistory() : viewSettings();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === TAB ? 'page' : 'false'));
}

/* ---------- etkilesim ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-tab]');
  if (!b) return;
  const act = b.dataset.act || 'tab';
  const tk = todayKey();
  if (act === 'tab') { TAB = b.dataset.tab; render(); scrollTo(0, 0); return; }
  if (act === 'ans') {
    answer(b.dataset.d, b.dataset.id, Number(b.dataset.v));
    render(); scrollTo(0, 0); syncNtfy();
    clearTimeout(babaT); babaT = setTimeout(() => { babaSays = null; if (TAB === 'bugun') render(); }, 7000);
    return;
  }
  if (act === 'pray') {
    const d = day(b.dataset.d), k = b.dataset.k;
    d.p[k] = !d.p[k];
    save(); render();
    if (d.p[k]) toast(allFive(b.dataset.d) ? 'Beş vakit tamam, Allah kabul etsin.' : `${NAME[k]} işaretlendi`);
    syncNtfy();
    return;
  }
  if (act === 'water') { const d = day(tk); d.water = Math.max(0, d.water + Number(b.dataset.ml)); save(); render(); if (d.water >= S.settings.waterGoal && Number(b.dataset.ml) > 0) toast('Günlük su hedefi tamam'); return; }
  if (act === 'glass') {
    const d = day(tk), i = Number(b.dataset.i), g = S.settings.glass, filled = Math.floor(d.water / g);
    d.water = i + 1 === filled ? i * g : (i + 1) * g;
    save(); render(); return;
  }
  if (act === 'smin') { const d = day(tk), m = Number(b.dataset.m); d.sport = d.sport || { min: 0, type: '' }; d.sport.min = d.sport.min === m ? 0 : m; save(); render(); if (d.sport.min >= S.settings.sportGoal) toast('Spor hedefi tamam'); return; }
  if (act === 'stype') { const d = day(tk), t = b.dataset.t; d.sport = d.sport || { min: 0, type: '' }; d.sport.type = d.sport.type === t ? '' : t; save(); render(); return; }
  if (act === 'sday') {
    const i = Number(b.dataset.i), a = S.settings.sportDays;
    S.settings.sportDays = a.includes(i) ? a.filter(x => x !== i) : a.concat(i);
    save(); render(); syncNtfy(); return;
  }
  if (act === 'copy') {
    try { await navigator.clipboard.writeText(S.settings.topic); toast('Kanal adı kopyalandı'); }
    catch (x) { const r = document.createRange(); r.selectNodeContents($('#topicTxt')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Seçildi, kopyala'); }
    return;
  }
  if (act === 'test') {
    b.disabled = true;
    try {
      const r = await ntfyPost({ title: 'Vakit', message: 'Bu mesaj geldiyse artık gözüm üstünde. Namazını, suyunu, sporunu soracağım; kaçamazsın.', tags: ['white_check_mark'], icon: new URL('baba.png', location.href).href, click: location.origin + location.pathname });
      toast(r.ok ? 'Gönderildi, telefonuna bak' : 'Gönderilemedi (' + r.status + ')');
    } catch (x) { toast('ntfy\'ye ulaşılamadı, interneti kontrol et'); }
    b.disabled = false; return;
  }
  if (act === 'ntfy') {
    S.settings.ntfyOn = !S.settings.ntfyOn; save(); render();
    if (S.settings.ntfyOn) { toast('Hatırlatmalar kuruluyor…'); await ensureTimes(); await syncNtfy(); toast(S.syncErr || 'Hatırlatmalar kuruldu'); }
    else { toast('Hatırlatmalar siliniyor…'); await clearNtfy(); toast('Hatırlatmalar kapatıldı'); render(); }
    return;
  }
  if (act.startsWith('perm-')) {
    const m = { 'perm-overlay': 'requestOverlay', 'perm-notif': 'requestNotif', 'perm-exact': 'requestExact', 'perm-battery': 'requestBattery' }[act];
    try { window.VakitApp[m](); } catch (x) {}
    return;
  }
  if (act === 'try') {
    const type = b.dataset.t, tk = todayKey();
    const r = String(Date.now());
    const a = type === 'w' ? { id: 'w1', type: 'w', dk: tk, ts: Date.now(), q: pick(L.wAsk, r) }
      : type === 's' ? { id: 's1', type: 's', dk: tk, ts: Date.now(), q: pick(L.sAsk, r) }
      : { id: 'p:ogle', type: 'p', k: 'ogle', dk: tk, ts: Date.now(), q: pick(L.ask.ogle, r) };
    try { window.VakitApp.testAsk(JSON.stringify(nativeAsk(a))); } catch (x) {}
    return;
  }
  if (act === 'export' && APP) { try { window.VakitApp.share(JSON.stringify({ settings: S.settings, days: S.days })); } catch (x) {} return; }
  if (act === 'export') {
    const blob = new Blob([JSON.stringify({ settings: S.settings, days: S.days }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `vakit-yedek-${tk}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000); return;
  }
  if (act === 'import') { $('#importFile').click(); return; }
});

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j.days) throw 0;
    S = merge(Object.assign({}, S, { settings: j.settings || S.settings, days: Object.assign({}, S.days, j.days) }));
    save(); render(); toast('Yedek yüklendi');
  } catch (x) { toast('Bu dosya Vakit yedeği değil'); }
  e.target.value = '';
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-set]'); if (!el) return;
  const path = el.dataset.set, s = S.settings;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'number' || el.tagName === 'SELECT') { v = Number(v); if (!isFinite(v) || v <= 0) { render(); return; } }
  if (el.type === 'time' && !v) { render(); return; }
  if (path.startsWith('n.')) s.n[path.slice(2)] = v;
  else s[path] = typeof v === 'string' ? v.trim() : v;
  save();
  if (path === 'city') { await ensureTimes(true); toast(timesErr ? timesErr : `Vakitler ${s.city} için güncellendi`); }
  render(); syncNtfy();
});

/* ---------- baslangic ---------- */
let shownDay = todayKey();
function tick() {
  if (todayKey() !== shownDay) { shownDay = todayKey(); ensureTimes().then(() => { render(); syncNtfy(); }); return; }
  if (TAB !== 'bugun') return;
  const st = vakitState();
  const c = $('#count');
  if (st && st.next && c) { if (st.next.ts <= Date.now() + 1000) render(); else c.innerHTML = dur(st.next.ts - Date.now()); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); ensureTimes().then(() => { render(); syncNtfy(); }); } });
addEventListener('online', () => ensureTimes().then(() => { render(); syncNtfy(); }));
setInterval(tick, 20000);

(function fromNotification() {
  const m = /^(\d{4}-\d{2}-\d{2})~(p:(?:sabah|ogle|ikindi|aksam|yatsi)|w[12]|s[12])~([01])$/.exec(new URLSearchParams(location.search).get('c') || '');
  if (m) { answer(m[1], m[2], Number(m[3])); babaT = setTimeout(() => { babaSays = null; if (TAB === 'bugun') render(); }, 9000); }
  if (location.search) history.replaceState(null, '', location.pathname);
})();
applyNative();
render();
ensureTimes().then(() => { render(); syncNtfy(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
